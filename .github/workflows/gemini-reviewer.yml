name: 🤖 Gemini Code Reviewer

on:
  pull_request:
    types: [opened, synchronize] # Chỉ chạy khi có Pull Request mới hoặc code mới được đẩy lên PR

jobs:
  gemini_review:
    name: 🧠 Agentic AI Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Quyền tối quan trọng để bot được phép comment vào PR
    steps:
      - name: 📥 Tải mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Tải toàn bộ lịch sử Git để so sánh sự thay đổi (Diff)

      - name: ⚙️ Cài đặt Python & Thư viện
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 📦 Cài đặt SDK Google Generative AI
        run: pip install -q google-generativeai

      - name: 🔍 Lấy nội dung code thay đổi
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr_diff.txt
          echo "Đã trích xuất thành công các dòng code mới."

      - name: 🤖 Kích hoạt LLM Suy luận
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import google.generativeai as genai

          try:
              genai.configure(api_key=os.environ['GEMINI_API_KEY'])
              
              # Yêu cầu Google liệt kê toàn bộ model khả dụng
              models = [m.name for m in genai.list_models() if 'generateContent' in m.supported_generation_methods]
              
              if models:
                  text = '🔍 **Danh sách model Google cho phép API Key này sử dụng:**\n\n'
                  for m in models:
                      text += f'- \`{m}\`\n'
                  text += '\n💡 *Hãy copy một tên trong danh sách trên để thay vào code bot AI nhé!*'
              else:
                  text = '⚠️ API Key kết nối thành công nhưng không có quyền dùng model nào.'
                  
              with open('review.txt', 'w', encoding='utf-8') as f:
                  f.write(text)
          except Exception as e:
              with open('review.txt', 'w', encoding='utf-8') as f:
                  f.write(f'⚠️ Lỗi Debug: {str(e)}')
          "

      - name: 💬 Bắn Comment vào giao diện GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body-file review.txt