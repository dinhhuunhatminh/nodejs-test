name: Smart CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      selected_layers:
        description: 'Chọn các lớp bảo mật (VD: SAST,SCA,DAST)'
        required: true
        default: 'SAST,SCA,DAST'
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  brain_optimizer:
    runs-on: ubuntu-latest
    outputs:
      sast_choice: ${{ steps.think.outputs.sast_choice }}
      sca_choice: ${{ steps.think.outputs.sca_choice }}
      dast_choice: ${{ steps.think.outputs.dast_choice }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 
      - name: Tính LOC
        id: calc_loc
        run: |
          LOC=$(git diff HEAD~1 HEAD --numstat | awk '{s+=$1+$2} END {print s}')
          if [ -z "$LOC" ]; then LOC=10; fi
          echo "loc=$LOC" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cài MongoDB Driver
        run: pip install -q pymongo certifi
      - name: Chạy Thuật toán Tối ưu
        id: think
        env:
          TIME_BUDGET: 5400
          LOC_CHANGED: ${{ steps.calc_loc.outputs.loc }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SELECTED_LAYERS: ${{ github.event.inputs.selected_layers || 'SAST,SCA,DAST' }}
        run: python dp_optimizer_2.py

  run_sast:
    needs: brain_optimizer
    runs-on: ubuntu-latest
    if: needs.brain_optimizer.outputs.sast_choice != 'sast_skip'
    outputs:
      duration: ${{ steps.sast_scan.outputs.duration }}
      issues: ${{ steps.sast_scan.outputs.issues }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Chạy SAST và Trích xuất lỗi
        id: sast_scan
        run: |
          START_TIME=$(date +%s)
          CHOICE="${{ needs.brain_optimizer.outputs.sast_choice }}"
          ISSUES=0

          if [ "$CHOICE" == "semgrep_standard" ]; then
            pip install -q semgrep
            semgrep scan --config auto --exclude "node_modules" --exclude "views" --json -o report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '.results | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "njsscan_quick" ]; then
            pip install -q njsscan
            njsscan . --sarif -o report.sarif >/dev/null 2>&1 || true
            if [ -s report.sarif ]; then ISSUES=$(jq '[.runs[0].results[]? | select(.level == "error")] | length' report.sarif 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "sonar_deep" ]; then
            docker run --rm -v "$(pwd):/usr/src" sonarsource/sonar-scanner-cli >/dev/null 2>&1 || true
            ISSUES=0 # Sonar không xuất JSON local

          elif [ "$CHOICE" == "codeql_full" ]; then
            wget -q https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
            tar -xzf codeql-bundle-linux64.tar.gz
            ./codeql/codeql database create db --language=javascript >/dev/null 2>&1 || true
            ./codeql/codeql database analyze db javascript-security-extended.qls --format=sarif-latest --output=report.sarif >/dev/null 2>&1 || true
            if [ -s report.sarif ]; then ISSUES=$(jq '[.runs[0].results[]? | select(.level == "error")] | length' report.sarif 2>/dev/null || echo 0); fi

          # ====== CÁC CÔNG CỤ SAST MỚI ======
          elif [ "$CHOICE" == "gitleaks_fast" ]; then
            wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
            tar -xzf gitleaks_8.18.2_linux_x64.tar.gz
            ./gitleaks detect --source . -v --report-format json --report-path report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq 'length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "spotbugs_java" ]; then
            # SpotBugs phân tích bytecode Java. Dùng docker image chuẩn của SpotBugs.
            docker run --rm -v "$(pwd):/workspace" spotbugs/spotbugs:latest -textui -sarif -output /workspace/report.sarif /workspace >/dev/null 2>&1 || true
            if [ -s report.sarif ]; then ISSUES=$(jq '[.runs[0].results[]? | select(.level == "error" or .level == "warning")] | length' report.sarif 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "bandit_python" ]; then
            pip install -q bandit
            bandit -r . -f json -o report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '.results | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "checkov_iac" ]; then
            pip install -q checkov
            checkov -d . -o json > report.json 2>/dev/null || true
            if [ -s report.json ]; then ISSUES=$(jq '.results.failed_checks | length' report.json 2>/dev/null || echo 0); fi
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "issues=${ISSUES:-0}" >> $GITHUB_OUTPUT
          echo "==> SAST ($CHOICE) tìm thấy ${ISSUES:-0} lỗi thực tế."

      - name: Upload Báo cáo SAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: report.*
          retention-days: 1


  run_sca:
    needs: [brain_optimizer]
    if: needs.brain_optimizer.outputs.sca_choice != 'sca_skip'
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.sca_scan.outputs.duration }}
      issues: ${{ steps.sca_scan.outputs.issues }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chạy SCA
        id: sca_scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          START_TIME=$(date +%s)
          CHOICE="${{ needs.brain_optimizer.outputs.sca_choice }}"
          ISSUES=0

          if [ "$CHOICE" == "trivy_standard" ]; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin >/dev/null 2>&1
            trivy fs --scanners vuln --severity HIGH,CRITICAL --format json --output report.json . >/dev/null 2>&1 || true
            if [ -f report.json ]; then ISSUES=$(jq '[.Results[]? | (.Vulnerabilities // []) | length] | add // 0' report.json 2>/dev/null || echo 0); fi
            
          elif [ "$CHOICE" == "trivy_deep" ]; then
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin >/dev/null 2>&1
            trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --format json --output report.json . >/dev/null 2>&1 || true
            if [ -f report.json ]; then ISSUES=$(jq '[.Results[]? | (.Vulnerabilities // []) + (.Secrets // []) | length] | add // 0' report.json 2>/dev/null || echo 0); fi
            
          elif [ "$CHOICE" == "npm_audit" ]; then
            npm install --package-lock-only --silent || true
            npm audit --json > report.json 2>/dev/null || true
            if [ -f report.json ]; then ISSUES=$(jq '(.metadata.vulnerabilities.high // 0) + (.metadata.vulnerabilities.critical // 0)' report.json 2>/dev/null || echo 0); fi
            
          elif [ "$CHOICE" == "snyk_advanced" ]; then
            npm install -g snyk --silent
            snyk test --all-projects --severity-threshold=high --json > report.json 2>/dev/null || true
            if [ -f report.json ]; then ISSUES=$(jq 'if type == "array" then [.[].uniqueCount] | add else .uniqueCount end' report.json 2>/dev/null || echo 0); fi

          # ====== CÁC CÔNG CỤ SCA MỚI ======
          elif [ "$CHOICE" == "grype_fast" ]; then
            curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin >/dev/null 2>&1
            grype . -o json > report.json 2>/dev/null || true
            if [ -s report.json ]; then ISSUES=$(jq '[.matches[]? | select(.vulnerability.severity == "High" or .vulnerability.severity == "Critical")] | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "retire_js" ]; then
            npm install -g retire >/dev/null 2>&1
            retire --jspath . --outputformat json --outputpath report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.[].results[]?.vulnerabilities[]?] | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "owasp_dep_check" ]; then
            wget -q https://github.com/jeremylong/DependencyCheck/releases/download/v9.0.9/dependency-check-9.0.9-release.zip
            unzip -q dependency-check-9.0.9-release.zip
            ./dependency-check/bin/dependency-check.sh --scan . --format JSON --out report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.dependencies[]?.vulnerabilities[]? | select(.cvssv3.baseSeverity == "HIGH" or .cvssv3.baseSeverity == "CRITICAL")] | length' report.json 2>/dev/null || echo 0); fi
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "issues=${ISSUES:-0}" >> $GITHUB_OUTPUT
          echo "==> KẾT QUẢ: SCA ($CHOICE) tìm thấy ${ISSUES:-0} lỗi nghiêm trọng."
          
      - name: Upload Báo cáo SCA
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: report.*
          retention-days: 1


  run_dast:
    needs: [brain_optimizer]
    if: needs.brain_optimizer.outputs.dast_choice != 'dast_skip'
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.dast_scan.outputs.duration }}
      issues: ${{ steps.dast_scan.outputs.issues }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Khởi động Server (Bắt buộc cho DAST)
        run: |
          npm install
          npm start > server.log 2>&1 &
          sleep 15
          curl -I http://localhost:5006 || exit 1
      - name: Chạy DAST (Cấp quyền)
        run: chmod -R 777 .
      - name: Thực thi Tool DAST (Đã bọc giáp chống Crash)
        id: dast_scan
        run: |
          START_TIME=$(date +%s)
          CHOICE="${{ needs.brain_optimizer.outputs.dast_choice }}"
          ISSUES=0

          if [ "$CHOICE" == "nuclei_fast" ]; then
            wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.1.9/nuclei_3.1.9_linux_amd64.zip || true
            unzip -o -q nuclei_3.1.9_linux_amd64.zip || true
            ./nuclei -u http://localhost:5006 -severity high,critical -jsonl -o report.jsonl >/dev/null 2>&1 || true
            if [ -s report.jsonl ]; then ISSUES=$(wc -l < report.jsonl 2>/dev/null || echo 0); fi
            
          elif [ "$CHOICE" == "zap_quick" ]; then
            docker run --network="host" -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5006 -J report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.site[].alerts[]? | select(.riskcode == "3") | .count | tonumber] | add // 0' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "zap_ajax_spider" ]; then
            docker run --network="host" -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://localhost:5006 -j -J report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.site[].alerts[]? | select(.riskcode == "3") | .count | tonumber] | add // 0' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "zap_full" ]; then
            docker run --network="host" -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t http://localhost:5006 -J report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.site[].alerts[]? | select(.riskcode == "3") | .count | tonumber] | add // 0' report.json 2>/dev/null || echo 0); fi

          # ====== CÁC CÔNG CỤ DAST MỚI (ĐÃ FIX URL) ======
          elif [ "$CHOICE" == "ffuf_fuzzer" ]; then
            wget -q https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz || true
            tar -xzf ffuf_2.1.0_linux_amd64.tar.gz || true
            wget -q https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/common.txt || true
            ./ffuf -u http://localhost:5006/FUZZ -w common.txt -of json -o report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '.results | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "kiterunner_api" ]; then
            # ĐÃ FIX: Tên file chính xác của kiterunner 1.0.2
            wget -q https://github.com/assetnote/kiterunner/releases/download/v1.0.2/kiterunner_1.0.2_linux_amd64.tar.gz || true
            tar -xzf kiterunner_1.0.2_linux_amd64.tar.gz || true
            wget -q https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/api/api-endpoints.txt || true
            # Sau khi giải nén, file thực thi sẽ mang tên là "kr"
            ./kr scan http://localhost:5006 -w api-endpoints.txt -o json > report.json 2>/dev/null || true
            if [ -s report.json ]; then ISSUES=$(jq '[.[]? | select(.status == 200)] | length' report.json 2>/dev/null || echo 0); fi

          elif [ "$CHOICE" == "arachni_spa" ]; then
            docker run --rm --network="host" -v $(pwd):/reports arachni/arachni bin/arachni http://localhost:5006 --report-save-path=/reports/arachni.afr >/dev/null 2>&1 || true
            docker run --rm -v $(pwd):/reports arachni/arachni bin/arachni_reporter /reports/arachni.afr --reporter=json:outfile=/reports/report.json >/dev/null 2>&1 || true
            if [ -s report.json ]; then ISSUES=$(jq '[.issues[]? | select(.severity == "high")] | length' report.json 2>/dev/null || echo 0); fi
          fi

          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          echo "issues=${ISSUES:-0}" >> $GITHUB_OUTPUT
          echo "==> DAST ($CHOICE) tìm thấy ${ISSUES:-0} lỗi nghiêm trọng."
          
      - name: Upload Báo cáo DAST
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-report
          path: report.*
          retention-days: 1

  ai_reporter:
    needs: [brain_optimizer, run_sast, run_sca, run_dast]
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Tải báo cáo SAST
        uses: actions/download-artifact@v4
        with:
          name: sast-report
          path: ./reports/sast
        continue-on-error: true

      - name: Tải báo cáo SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-report
          path: ./reports/sca
        continue-on-error: true

      - name: Tải báo cáo DAST
        uses: actions/download-artifact@v4
        with:
          name: dast-report
          path: ./reports/dast
        continue-on-error: true

      - name: Cài đặt thư viện Python cho AI
        run: pip install -q google-genai

      - name: AI Phân tích Lỗ hổng và Phản hồi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # TRUYỀN QUYẾT ĐỊNH CỦA KNAPSACK VÀO PYTHON
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SAST_TOOL: ${{ needs.brain_optimizer.outputs.sast_choice }}
          SCA_TOOL: ${{ needs.brain_optimizer.outputs.sca_choice }}
          DAST_TOOL: ${{ needs.brain_optimizer.outputs.dast_choice }}
        run: |
          python - << 'EOF'
          from google import genai
          import os
          import glob

          client = genai.Client(api_key=os.environ['GEMINI_API_KEY'])

          source_code = ''
          for root, dirs, files in os.walk('.'):
              if '.git' in root or 'node_modules' in root or 'reports' in root:
                  continue
              for file in files:
                  if file.endswith(('.js', '.py', '.ts', '.jsx', '.json', '.yml', '.java')):
                      filepath = os.path.join(root, file)
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              source_code += f'\n--- BẮT ĐẦU FILE: {filepath} ---\n' + f.read()[:5000] + f'\n--- KẾT THÚC FILE: {filepath} ---\n'
                      except Exception:
                          pass

          if not source_code:
              source_code = 'Không tìm thấy file mã nguồn hợp lệ nào.'

          raw_reports = ''
          for file_path in glob.glob('./reports/**/*.json', recursive=True):
              try:
                  with open(file_path, 'r', encoding='utf-8') as f:
                      raw_reports += '\n[BÁO CÁO TỪ FILE: ' + os.path.basename(file_path) + ']\n' + f.read()[:2000]
              except Exception:
                  pass

          prompt = f'''
          Bạn là một chuyên gia DevSecOps. 
          Dưới đây là TOÀN BỘ mã nguồn của dự án và kết quả quét từ các công cụ bảo mật.

          MÃ NGUỒN DỰ ÁN:
          """
          {source_code}
          """

          KẾT QUẢ TỪ MÁY QUÉT:
          """
          {raw_reports if raw_reports else 'Không có tệp báo cáo nào được tìm thấy.'}
          """

          YÊU CẦU ĐÁNH GIÁ:
          1. Đọc kết quả từ máy quét để tìm ra các lỗi bảo mật.
          2. Đối chiếu lỗi đó với MÃ NGUỒN DỰ ÁN phía trên. Phải chỉ đích danh TÊN FILE và DÒNG CODE chứa lỗi.
          3. Giải thích ngắn gọn lý do tại sao dòng code đó nguy hiểm.
          4. Cung cấp đoạn mã an toàn để thay thế (Mã nguồn sạch để copy/paste).
          5. Trả lời bằng TIẾNG VIỆT, định dạng Markdown rõ ràng. Nếu an toàn, hãy báo cáo rõ.
          '''

          try:
              response = client.models.generate_content(
                  model='gemini-2.5-flash',
                  contents=prompt
              )
              
              print('\n================ GÓC NHẬN XÉT CỦA AI GEMINI ================')
              print(response.text)
              print('===========================================================')
              
              # --- ĐOẠN CODE MỚI: ĐẨY LÊN MONGODB ---
              import pymongo
              import datetime
              
              # Lấy thông tin ngữ cảnh từ GitHub Actions
              repo_name = os.environ.get("GITHUB_REPOSITORY", "unknown-repo").split('/')[-1]
              commit_sha = os.environ.get("GITHUB_SHA", "unknown-commit")[:7] # Lấy 7 số đầu cho gọn
              
              sast_tool = os.environ.get("SAST_TOOL", "N/A")
              sca_tool = os.environ.get("SCA_TOOL", "N/A")
              dast_tool = os.environ.get("DAST_TOOL", "N/A")

              # Đóng gói dữ liệu chuẩn bị đẩy lên
              report_data = {
                  "repo_name": repo_name,
                  "commit_sha": commit_sha,
                  "timestamp": datetime.datetime.utcnow(),
                  "knapsack": {
                      "sast": sast_tool,
                      "sca": sca_tool,
                      "dast": dast_tool
                  },
                  "ai_report": response.text
              }

              # Ghi vào collection 'scan_reports'
              mongo_client = pymongo.MongoClient(os.environ['MONGO_URI'])
              db = mongo_client['devsecops']
              collection = db['scan_reports']
              collection.insert_one(report_data)
              
              print("✅ Đã đẩy báo cáo AI lên MongoDB (collection: scan_reports) thành công!")
              # --------------------------------------
                  
          except Exception as e:
              print(f'Lỗi hệ thống khi gọi Gemini API hoặc lưu MongoDB: {e}')
          EOF

      - name: Đăng toàn bộ báo cáo lên PR Conversation
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ -f "ai_review.md" ]; then
            gh pr comment $PR_URL -F ai_review.md
            echo "Đã dán thành công toàn bộ nhận xét của AI vào tab Conversation!"
          else
            echo "Không thấy file ai_review.md đâu cả."
          fi
          
  feedback_and_learn:
    # Cập nhật danh sách needs đầy đủ:
    needs: [brain_optimizer, run_sast, run_sca, run_dast, ai_reporter]
    runs-on: ubuntu-latest
    if: always() 
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Cài MongoDB
        run: pip install -q pymongo
      - name: Cập nhật Feedback
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          S_CHOICE="${{ needs.brain_optimizer.outputs.sast_choice }}"
          S_DUR="${{ needs.run_sast.outputs.duration }}"
          S_SCORE="${{ needs.run_sast.outputs.issues }}"

          C_CHOICE="${{ needs.brain_optimizer.outputs.sca_choice }}"
          C_DUR="${{ needs.run_sca.outputs.duration }}"
          C_SCORE="${{ needs.run_sca.outputs.issues }}"

          D_CHOICE="${{ needs.brain_optimizer.outputs.dast_choice }}"
          D_DUR="${{ needs.run_dast.outputs.duration }}"
          D_SCORE="${{ needs.run_dast.outputs.issues }}"

          if [ -n "$S_CHOICE" ] && [ "$S_CHOICE" != "sast_skip" ] && [ -n "$S_DUR" ] && [ -n "$S_SCORE" ]; then
            python feedback_updater.py --cat SAST --id "$S_CHOICE" --time "$S_DUR" --score "$S_SCORE" > /dev/null 2>&1 || true
          fi
          if [ -n "$C_CHOICE" ] && [ "$C_CHOICE" != "sca_skip" ] && [ -n "$C_DUR" ] && [ -n "$C_SCORE" ]; then
            python feedback_updater.py --cat SCA --id "$C_CHOICE" --time "$C_DUR" --score "$C_SCORE" > /dev/null 2>&1 || true
          fi
          if [ -n "$D_CHOICE" ] && [ "$D_CHOICE" != "dast_skip" ] && [ -n "$D_DUR" ] && [ -n "$D_SCORE" ]; then
            python feedback_updater.py --cat DAST --id "$D_CHOICE" --time "$D_DUR" --score "$D_SCORE" > /dev/null 2>&1 || true
          fi
      - name: Export Latest Metadata to File
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          python -c "
          import pymongo, os, json
          try:
              client = pymongo.MongoClient(os.environ['MONGO_URI'])
              db = client['devsecops']
              collection = db['tools']
              data = collection.find_one()
              if data and '_id' in data:
                  del data['_id']
              with open('latest_metadata.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, indent=4, ensure_ascii=False)
              print('Export successful')
          except Exception as e:
              print(f'Export failed: {e}')
          "
      - name: Upload Metadata Artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-mongodb-data
          path: latest_metadata.json