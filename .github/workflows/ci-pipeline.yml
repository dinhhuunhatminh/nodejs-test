name: Smart CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # BƯỚC 0: AI/THUẬT TOÁN QUYẾT ĐỊNH
  brain_optimizer:
    runs-on: ubuntu-latest
    outputs:
      sast_choice: ${{ steps.think.outputs.SAST }}
      sca_choice: ${{ steps.think.outputs.SCA }}
      dast_choice: ${{ steps.think.outputs.DAST }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 

      - name: Tự động đếm dòng code thay đổi (LOC)
        id: calc_loc
        run: |
          LOC=$(git diff HEAD~1 HEAD --numstat | awk '{s+=$1+$2} END {print s}')
          if [ -z "$LOC" ]; then LOC=10; fi
          echo "Tổng số dòng code thay đổi: $LOC"
          echo "loc=$LOC" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Cài đặt thư viện MongoDB
      - name: Cài đặt thư viện MongoDB
        run: pip install pymongo certifi

      - name: Chạy Thuật toán Tối ưu
        id: think
        env:
          # Ép thời gian và LOC ở đây để chạy kịch bản
          TIME_BUDGET: 1800
          LOC_CHANGED: ${{ steps.calc_loc.outputs.loc }}
          MONGO_URI: ${{ secrets.MONGO_URI }} 
        run: |
          echo "Đề bài: LOC=$LOC_CHANGED, Time=$TIME_BUDGET giây"
          
          # Chỉ cần gọi Python, script sẽ tự in bảng và truyền kết quả đi
          python dp_optimizer.py
  # BƯỚC 1: THỰC THI SAST (Semgrep)
  run_sast:
    needs: brain_optimizer
    runs-on: ubuntu-latest
    if: needs.brain_optimizer.outputs.sast_choice != 'sast_skip'
    outputs:
      duration: ${{ steps.sast_scan.outputs.duration }}
      issues: ${{ steps.sast_scan.outputs.issues }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt Semgrep
        run: python -m pip install semgrep

      - name: Chạy SAST và Trích xuất lỗi
        id: sast_scan
        run: |
          START_TIME=$(date +%s)
          
          # Định tuyến AI: Chọn độ sâu của luật quét
          if [ "${{ needs.brain_optimizer.outputs.sast_choice }}" == "sonar_quick" ]; then
            semgrep scan --config auto --json -o sast-report.json || true
          elif [ "${{ needs.brain_optimizer.outputs.sast_choice }}" == "sonar_deep" ]; then
            semgrep scan --config p/default --config p/security-audit --json -o sast-report.json || true
          fi
          
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          
          # Trích xuất số lượng lỗi từ file JSON
          if [ -f sast-report.json ]; then
            ISSUES=$(jq '.results | length' sast-report.json)
          else
            ISSUES=0
          fi
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT
          echo "SAST đã tìm thấy $ISSUES lỗi bảo mật."

          #KÍCH HOẠT FAIL-FAST
          if [ "$ISSUES" -gt 0 ]; then
            echo "Chặn đường ống ngay lập tức do SAST phát hiện lỗi!"
            exit 1
          fi

  # BƯỚC 2: THỰC THI SCA (Trivy)
  run_sca:
    needs: [brain_optimizer, run_sast] # Nối đuôi chờ SAST chạy xong
    runs-on: ubuntu-latest
    # Chạy nếu SAST không lỗi, không bị hủy, và AI không bắt skip SCA
    if: always() && needs.run_sast.result != 'failure' && needs.run_sast.result != 'cancelled' && needs.brain_optimizer.outputs.sca_choice != 'sca_skip'
    outputs:
      duration: ${{ steps.sca_scan.outputs.duration }}
      issues: ${{ steps.sca_scan.outputs.issues }}
    steps:
      - uses: actions/checkout@v4
      - name: Cài đặt Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy --version
      - name: Chạy Trivy và Trích xuất lỗi
        id: sca_scan
        run: |
          START_TIME=$(date +%s)
          if [ "${{ needs.brain_optimizer.outputs.sca_choice }}" == "trivy_standard" ]; then
            trivy fs --scanners vuln --format json --output trivy-report.json . || true #không sập luôn mà chờ log
          elif [ "${{ needs.brain_optimizer.outputs.sca_choice }}" == "trivy_deep" ]; then
            trivy fs --scanners vuln,secret,misconfig --format json --output trivy-report.json . || true
          fi
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          if [ -f trivy-report.json ]; then
            ISSUES=$(jq '[.Results[]?.Vulnerabilities | length] | add // 0' trivy-report.json)
          else
            ISSUES=0
          fi
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

          #KÍCH HOẠT FAIL FAST
          if [ "$ISSUES" -gt 0 ]; then
            echo "Phát hiện thư viện dính CVE"
            exit 1
          fi

  # BƯỚC 3: THỰC THI DAST (OWASP ZAP)
  run_dast:
    needs: [brain_optimizer, run_sca] # Nối đuôi chờ SCA chạy xong
    runs-on: ubuntu-latest
    # Chạy nếu SCA không lỗi, không bị hủy, và AI không bắt skip DAST
    if: always() && needs.run_sca.result != 'failure' && needs.run_sca.result != 'cancelled' && needs.brain_optimizer.outputs.dast_choice != 'dast_skip'
    outputs:
      duration: ${{ steps.dast_scan.outputs.duration }}
      issues: ${{ steps.dast_scan.outputs.issues }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Khởi động ứng dụng Node.js
        run: |
          npm install
          npm start > app_output.log 2>&1 &
          sleep 15
          
      - name: Ghi nhận thời gian bắt đầu
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      #FIX LỖI PERMISSION CỦA DOCKER
      - name: Cấp quyền ghi cho thư mục làm việc của ZAP
        run: chmod -R 777 .

      - name: Chạy OWASP ZAP (Bản Nhẹ)
        if: needs.brain_optimizer.outputs.dast_choice == 'zap_quick'
        uses: zaproxy/action-baseline@v0.14.0
        continue-on-error: true # Bỏ qua lỗi sập tiến trình
        with:
          target: 'http://localhost:5006'
          fail_action: false #FALSE: Không đánh sập khi có cảnh báo
          allow_issue_writing: false #FALSE: Đỡ tạo Issue rác trên GitHub

      - name: Chạy OWASP ZAP (Bản Full)
        if: needs.brain_optimizer.outputs.dast_choice == 'zap_full'
        uses: zaproxy/action-full-scan@v0.12.0  
        continue-on-error: true
        with:
          target: 'http://localhost:5006'
          fail_action: false
          allow_issue_writing: false

      - name: Tính thời gian và Lấy số lượng lỗi thực tế
        id: dast_scan
        #luôn chạy dù ZAP có báo fail ở trên
        if: always() 
        run: |
          END_TIME=$(date +%s)
          echo "duration=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
          
          # Đọc file report_json.json sinh ra từ ZAP để đếm chính xác số lượng cảnh báo
          if [ -f report_json.json ]; then
             ISSUES=$(jq '[.site[].alerts[].count | tonumber] | add // 0' report_json.json)
          else
             ISSUES=0
          fi
          
          echo "ZAP đã tìm thấy $ISSUES cảnh báo"
          echo "issues=$ISSUES" >> $GITHUB_OUTPUT

          #KÍCH HOẠT FAIL FAST
          if [ "$ISSUES" -gt 0 ]; then
            echo "Ứng dụng có lỗ hổng khi chạy thực tế"
            exit 1
          fi

  # BƯỚC 4: VÒNG LẶP PHẢN HỒI (TỰ HỌC)
  feedback_and_learn:
    needs: [brain_optimizer, run_sast, run_sca, run_dast]
    runs-on: ubuntu-latest
    if: always() 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      #Cài đặt thư viện MongoDB
      - name: Cài đặt thư viện MongoDB
        run: pip install pymongo

      - name: Cập nhật dữ liệu thực tế cho AI
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          echo "Bắt đầu trích xuất dữ liệu để cập nhật cho AI..."
          
          # 1. Gom tất cả output vào biến Bash cục bộ để xử lý an toàn
          S_CHOICE="${{ needs.brain_optimizer.outputs.sast_choice }}"
          S_DUR="${{ needs.run_sast.outputs.duration }}"
          S_SCORE="${{ needs.run_sast.outputs.issues }}"

          C_CHOICE="${{ needs.brain_optimizer.outputs.sca_choice }}"
          C_DUR="${{ needs.run_sca.outputs.duration }}"
          C_SCORE="${{ needs.run_sca.outputs.issues }}"

          D_CHOICE="${{ needs.brain_optimizer.outputs.dast_choice }}"
          D_DUR="${{ needs.run_dast.outputs.duration }}"
          D_SCORE="${{ needs.run_dast.outputs.issues }}"

          # 2. Xử lý SAST (Chỉ chạy khi có ID, không phải Skip, có thời gian và có điểm)
          if [ -n "$S_CHOICE" ] && [ "$S_CHOICE" != "sast_skip" ] && [ -n "$S_DUR" ] && [ -n "$S_SCORE" ]; then
            python feedback_updater.py --cat SAST --id "$S_CHOICE" --time "$S_DUR" --score "$S_SCORE"
          else
            echo "⚠️ Bỏ qua ghi nhận SAST (bị skip hoặc chưa kịp xuất dữ liệu)."
          fi

          # 3. Xử lý SCA
          if [ -n "$C_CHOICE" ] && [ "$C_CHOICE" != "sca_skip" ] && [ -n "$C_DUR" ] && [ -n "$C_SCORE" ]; then
             python feedback_updater.py --cat SCA --id "$C_CHOICE" --time "$C_DUR" --score "$C_SCORE"
          else
             echo "⚠️ Bỏ qua ghi nhận SCA (bị skip do Fail-fast ở bước trước)."
          fi

          # 4. Xử lý DAST
          if [ -n "$D_CHOICE" ] && [ "$D_CHOICE" != "dast_skip" ] && [ -n "$D_DUR" ] && [ -n "$D_SCORE" ]; then
             python feedback_updater.py --cat DAST --id "$D_CHOICE" --time "$D_DUR" --score "$D_SCORE"
          else
             echo "⚠️ Bỏ qua ghi nhận DAST (bị skip do Fail-fast ở bước trước)."
          fi
